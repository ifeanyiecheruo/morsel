parameters:
  - $ref: '../parameters.yaml#/OrgParam'
  - $ref: '../parameters.yaml#/RepoParam'
  - $ref: '../parameters.yaml#/AppNameParam'
get:
  operationId: getAppUtilisation
  summary: Get current resource usage and cost estimate for an app
  description: Returns recent CPU and memory usage averaged over the last collection window, and a projected monthly cost at the current usage rate.
  tags: [apps]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              cpu_cores:
                description: Average CPU usage in cores over the last collection window.
                type: number
                format: double
              memory_gb:
                description: Average memory usage in gigabytes.
                type: number
                format: double
              cost_estimate_monthly:
                description: Projected monthly cost in USD at the current usage rate.
                type: number
                format: double
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '404':
      $ref: '../responses.yaml#/ErrorNotFound'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
