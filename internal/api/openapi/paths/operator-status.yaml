get:
  operationId: getOperatorStatus
  summary: Platform health summary
  description: Returns a high-level health snapshot of the platform, including whether critical components are operational and how many apps are currently running.
  tags: [operator]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              healthy:
                description: True if all critical platform components are operational.
                type: boolean
              pending_approvals:
                description: Number of approval requests waiting for operator action.
                type: integer
              running_apps:
                description: Total number of apps currently running across all repos.
                type: integer
              certs:
                description: Certificate health summary. Only populated when one or more certificates require attention.
                type: object
                properties:
                  expiring_soon:
                    description: Domains whose TLS certificate expires within 30 days.
                    type: array
                    items:
                      type: string
                  failed:
                    description: Domains whose TLS certificate provisioning or renewal has failed.
                    type: array
                    items:
                      type: object
                      required: [domain, error]
                      properties:
                        domain:
                          type: string
                        error:
                          type: string
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
