# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: A pending change that requires operator approval before it can be applied.
type: object
required: [id, repo, app, field, current_value, requested_value, created_at]
properties:
  id:
    description: Unique identifier for this approval request.
    type: string
  repo:
    description: Slug of the repo the change belongs to.
    type: string
  app:
    description: Name of the app the change belongs to.
    type: string
  field:
    description: The configuration field whose new value is awaiting approval.
    type: string
  current_value:
    description: The field's current value.
    type: string
  requested_value:
    description: The value being requested.
    type: string
  created_at:
    description: When the approval was requested.
    type: string
    format: date-time
  expires_at:
    description: When this request expires and is automatically rejected.
    type: string
    format: date-time
