# yaml-language-server: $schema=https://raw.githubusercontent.com/ogen-go/ogen/main/schemas/ogen.jsonschema.json

parser:
   allow_remote: true

generator:
  features:
    enable:
      - client/editors
      - client/request/options
      - ogen/otel
      - ogen/unimplemented
      - paths/client
      - webhooks/client
    disable_all: true