<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="5">
<title>Waking {{.App}}…</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6f7;color:#1a1a1a;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:32px 40px;text-align:center;max-width:420px}
h1{font-size:18px;margin:0 0 8px;font-weight:600}
p{color:#6b7280;font-size:14px;margin:0}
.spinner{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#f6821f;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme: dark) {
  body{background:#111827;color:#f1f5f9}
  .card{background:#1f2937;border-color:#374151}
  p{color:#9ca3af}
}
</style>
</head>
<body>
<div class="card">
<div class="spinner"></div>
<h1>Waking {{.App}}…</h1>
<p>This page will refresh automatically in a few seconds.</p>
</div>
</body>
</html>
