# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: 'An asynchronous operation. Poll until status is "complete" or "failed".'
type: object
required: [id, type, status, progress, created_at]
properties:
  id:
    description: Unique identifier for this operation.
    type: string
  type:
    description: 'Kind of operation (e.g. "deploy", "delete").'
    type: string
  status:
    description: Current state of the operation.
    type: string
    enum: [pending, complete, failed]
  progress:
    description: Human-readable progress message.
    type: string
  created_at:
    description: When the operation was created.
    type: string
    format: date-time
  completed_at:
    description: When the operation finished. Null while still in progress.
    type: string
    format: date-time
    nullable: true
  error:
    description: Error detail if the operation failed. Null otherwise.
    nullable: true
    allOf:
      - $ref: './ErrorDetail.yaml'
