# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: Identifies a specific app for a budget-control exemption operation.
type: object
required: [repo_slug, app_name]
properties:
  repo_slug:
    description: Repository identifier in org/repo format.
    type: string
  app_name:
    description: App name within the repository.
    type: string
