# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: Admin request to set a password for any operator principal.
type: object
required: [new_password]
properties:
  new_password:
    description: The password to set for the principal. Must be at least 8 characters.
    type: string
    minLength: 8
  invalidate:
    description: If true, mark the password as requiring a reset on next login (temporary password flow).
    type: boolean
    default: false
