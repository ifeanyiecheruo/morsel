# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: An operator principal with its current status.
type: object
required: [github_login, is_operator, is_admin]
properties:
  github_login:
    description: The principal's GitHub login name.
    type: string
  is_operator:
    description: Whether this principal has operator privileges.
    type: boolean
  is_admin:
    description: Whether this principal has admin privileges.
    type: boolean
