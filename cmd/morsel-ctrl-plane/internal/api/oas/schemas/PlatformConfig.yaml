# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: Mutable platform-wide configuration managed by the operator.
type: object
properties:
  budget_ceiling_monthly:
    description: Maximum total monthly spend allowed across all repos, in USD.
    type: number
    format: double
  soft_limit_pct:
    description: Fraction of the budget ceiling at which wake is blocked for non-exempt apps (0.0–1.0).
    type: number
    format: double
  hard_limit_pct:
    description: Fraction of the budget ceiling at which non-exempt running apps are force-hibernated (0.0–1.0).
    type: number
    format: double
  default_idle_after:
    description: Default idle-before-hibernate duration for apps that do not override it (e.g. "24h").
    type: string
