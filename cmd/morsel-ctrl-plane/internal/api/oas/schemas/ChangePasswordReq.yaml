# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: Request to reset the currently authenticated operator's password. Requires the current password for verification.
type: object
required: [current_password, new_password]
properties:
  current_password:
    description: The operator's current password, used to verify identity before the change is accepted.
    type: string
    minLength: 1
  new_password:
    description: The new password to set. Must be at least 8 characters.
    type: string
    minLength: 8
