# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema
description: Request to reset the currently authenticated operator's password. A valid bearer token is sufficient proof of identity.
type: object
required: [new_password]
properties:
  new_password:
    description: The new password to set. Must be at least 8 characters.
    type: string
    minLength: 8
