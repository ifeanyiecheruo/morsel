get:
  operationId: getOperatorConfig
  summary: Read platform config
  description: Returns the current mutable platform-wide settings, including budget limits.
  tags: [operator]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schemas/PlatformConfig.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
patch:
  operationId: updateOperatorConfig
  summary: Update mutable platform config
  description: Applies the supplied fields over the current config. Omitted fields are left unchanged.
  tags: [operator]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/PlatformConfig.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schemas/PlatformConfig.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
