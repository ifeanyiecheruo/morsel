post:
  operationId: invalidateOperatorPrincipalPassword
  summary: Invalidate a principal's password (admin only)
  description: |
    Admin-only. Marks the specified principal as requiring a password reset and
    immediately invalidates all existing refresh tokens. The password hash is
    preserved so the principal can still perform a self-service reset using their
    old password via POST /api/operator/password.
  tags: [operator]
  security:
    - bearerAuth: []
  parameters:
    - name: principal
      in: path
      description: The principal identity (URL-encoded email address).
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Password invalidated successfully.
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '404':
      $ref: '../responses.yaml#/ErrorNotFound'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
