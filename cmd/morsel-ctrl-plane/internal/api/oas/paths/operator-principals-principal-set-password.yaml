post:
  operationId: setOperatorPrincipalPassword
  summary: Set a password for any operator principal (admin only)
  description: |
    Admin-only. Sets a new password for the specified principal without requiring the
    current password. If `invalidate` is true, the principal will be required to change
    their password on next login (temporary password flow). Invalidates all existing
    refresh tokens for that principal.
  tags: [operator]
  security:
    - bearerAuth: []
  parameters:
    - name: principal
      in: path
      description: The principal identity (URL-encoded email address).
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/SetPrincipalPasswordReq.yaml'
  responses:
    '204':
      description: Password set successfully.
    '400':
      $ref: '../responses.yaml#/ErrorBadRequest'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '404':
      $ref: '../responses.yaml#/ErrorNotFound'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
