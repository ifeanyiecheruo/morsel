parameters:
  - $ref: '../parameters.yaml#/OrgParam'
  - $ref: '../parameters.yaml#/RepoParam'
get:
  operationId: listApps
  summary: List apps in a repo
  description: Returns every app currently deployed in the repo, including their status and image.
  tags: [apps]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/App.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
post:
  operationId: upsertApp
  summary: Upsert an app; runs staging handshake and applies Kubernetes manifest
  description: Creates or updates an app. Runs a staging handshake to validate the image before applying the manifest. Some changes may require operator approval and will appear in the pending_approval field of the response.
  tags: [apps]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/AppSpec.yaml'
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          required: true
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '../schemas/AcceptedOperation.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '409':
      $ref: '../responses.yaml#/ErrorConflict'
    '422':
      $ref: '../responses.yaml#/ErrorUnprocessable'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
