post:
  operationId: requirePasswordResetForPrincipal
  summary: Mark a principal as requiring a password reset
  description: Flags the specified principal so they must change their password on next login.
  tags: [operator]
  security:
    - bearerAuth: []
  parameters:
    - name: principal
      in: path
      description: The principal identity (URL-encoded email address) to flag.
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Flagged successfully.
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '404':
      $ref: '../responses.yaml#/ErrorNotFound'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
