post:
  operationId: resetOperatorPassword
  summary: Reset the authenticated operator's own password
  description: |
    Self-service password reset. The operator must supply their current password for
    verification. On success, the password-reset flag is cleared and all refresh tokens
    issued before this change are invalidated.
  tags: [operator]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/ChangePasswordReq.yaml'
  responses:
    '204':
      description: Password reset successfully.
    '400':
      $ref: '../responses.yaml#/ErrorBadRequest'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
