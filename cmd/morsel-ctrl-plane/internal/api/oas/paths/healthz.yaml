get:
  operationId: getHealthz
  summary: Health check
  description: >
    Returns 200 when all critical subsystems are healthy, 503 when one or more
    are degraded. The response body is always present and describes the status.
  tags: [system]
  responses:
    '200':
      description: All critical subsystems healthy.
      content:
        application/json:
          schema:
            $ref: '../schemas/HealthStatus.yaml'
    '503':
      description: One or more critical subsystems are degraded.
      content:
        application/json:
          schema:
            $ref: '../schemas/HealthStatus.yaml'
    default:
      $ref: '../responses.yaml#/ErrorInternalServer'
