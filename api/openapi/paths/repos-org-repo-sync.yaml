parameters:
  - $ref: '../parameters.yaml#/OrgParam'
  - $ref: '../parameters.yaml#/RepoParam'
post:
  operationId: syncRepo
  summary: Declarative app list reconciliation; detects deleted apps
  description: Reconciles the cluster against the supplied app list. Apps present in the cluster but absent from the list are queued for deletion. Equivalent to calling upsert for each listed app and delete for each omitted one, in a single atomic request.
  tags: [repos]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [apps]
          properties:
            apps:
              description: Complete list of apps that should exist in the repo after sync. Omit an app to delete it.
              type: array
              items:
                $ref: '../schemas/AppSpec.yaml'
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          required: true
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '../schemas/AcceptedOperation.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '409':
      $ref: '../responses.yaml#/ErrorConflict'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
