parameters:
  - $ref: '../parameters.yaml#/OrgParam'
  - $ref: '../parameters.yaml#/RepoParam'
  - $ref: '../parameters.yaml#/AppNameParam'
post:
  operationId: wakeApp
  summary: Force wake a hibernated app
  description: Scales the app back up from zero replicas. Use this to pre-warm the app before expected traffic rather than waiting for the first request to trigger wake-on-demand.
  tags: [apps]
  security:
    - bearerAuth: []
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          required: true
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '../schemas/AcceptedOperation.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '403':
      $ref: '../responses.yaml#/ErrorForbidden'
    '404':
      $ref: '../responses.yaml#/ErrorNotFound'
    '503':
      $ref: '../responses.yaml#/ErrorServiceUnavailable'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
