get:
  operationId: listRepos
  summary: List repos
  description: Returns repos the caller has access to. Developers see only their own repo; operators see all repos by default.
  tags: [repos]
  security:
    - bearerAuth: []
  parameters:
    - name: all
      in: query
      description: When true, returns all repos across all organisations. Requires operator privileges.
      schema:
        type: boolean
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Repo.yaml'
    '401':
      $ref: '../responses.yaml#/ErrorUnauthorized'
    '500':
      $ref: '../responses.yaml#/ErrorInternalServer'
